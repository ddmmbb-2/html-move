<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTMLmove</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101114; --panel: #17191e; --raised: #21242c; --line: #2d303a;
  --text: #f1f2f7; --muted: #adb2c2; --accent: #c3fa78; --ink: #152208;
  --main: #acc6ff; --overlay: #d6baff; --audio: #91e6c4; --graphic: #ffc68a;
  font: 14px/1.5 Inter, "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); }
button, input, select, textarea { font: inherit; }
button, select, input, textarea { color: inherit; }
button, select { cursor: pointer; }
button, select, input[type=number], textarea {
  min-height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised);
}
button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; white-space: nowrap; }
button:hover:enabled { border-color: #7c8293; background: #2b303a; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .38; cursor: default; }
button.primary { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 750; }
button.primary:hover:enabled { background: #d5ffa0; }
button.subtle { background: transparent; }
button.danger { color: #ffadad; }
input[type=range], progress { accent-color: var(--accent); }
input[type=number], textarea, select { padding: 5px 7px; min-width: 0; }
input[type=color] { width: 100%; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
kbd { font: 11px ui-monospace, monospace; color: var(--muted); }
header {
  min-height: 66px; padding: 12px 22px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.brand, .actions, .sectionbar, .transport, .tools, .inline { display: flex; align-items: center; gap: 8px; }
.brand { gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.5px; }
.mark { display: grid; width: 30px; height: 30px; place-items: center; background: var(--accent); border-radius: 8px; color: var(--ink); }
.mark::before { content: ""; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid currentColor; margin-left: 2px; }
.actions, .tools { flex-wrap: wrap; }
.workspace { display: grid; grid-template-columns: minmax(208px, 232px) minmax(0, 1fr) minmax(232px, 258px); gap: 12px; padding: 14px 18px 12px; }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sectionbar { min-height: 49px; padding: 8px 13px; border-bottom: 1px solid var(--line); justify-content: space-between; }
h1, h2, p { margin: 0; }
h2 { font-size: 13px; letter-spacing: .045em; }
.materials, .inspector { display: flex; flex-direction: column; }
#mediaList, #inspectorBody { max-height: min(49vh, 490px); min-height: 158px; overflow: auto; padding: 11px; }
#mediaList:empty::before { content: "匯入本機影片、圖片或音樂後，素材會出現在這裡。"; display: block; padding: 16px 7px; color: var(--muted); }
.asset { display: grid; grid-template-columns: 52px minmax(0,1fr); align-items: center; gap: 8px; padding: 8px; background: #1c1f25; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.asset-thumb { width: 52px; height: 37px; border-radius: 5px; object-fit: cover; display: grid; place-items: center; color: var(--muted); background: #101216; font-size: 18px; }
.asset strong, .inspect-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; font-weight: 650; }
.asset small, .hint { color: var(--muted); font-size: 12px; }
.asset-buttons { grid-column: 1 / -1; display: flex; gap: 5px; }
.asset-buttons button { min-height: 26px; font-size: 12px; padding: 2px 7px; }
.viewer { display: flex; flex-direction: column; }
.stage { min-height: 205px; height: clamp(205px, 42vh, 540px); position: relative; background: #0c0d10; display: grid; place-items: center; overflow: hidden; }
.surface { position: relative; aspect-ratio: 16 / 9; width: min(100%, calc(clamp(205px, 42vh, 540px) * 16 / 9)); }
canvas { display: block; width: 100%; height: 100%; }
#canvas { touch-action: none; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 18px; background: radial-gradient(ellipse at center, #1a2023, #111317 72%); }
.empty-glyph { width: 53px; height: 45px; border-radius: 10px; border: 1px dashed #637655; color: var(--accent); display: grid; place-items: center; font-size: 22px; }
.empty strong { font-size: clamp(14px, 2.1vw, 20px); }
.empty.drop { box-shadow: inset 0 0 0 2px var(--accent); }
[hidden] { display: none !important; }
.transport { min-height: 46px; padding: 6px 10px; gap: 7px; }
.transport button { min-width: 34px; padding: 4px; }
#play { color: var(--accent); }
#timeReadout { flex: none; font: 12px ui-monospace, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
#scrub { flex: 1; min-width: 40px; }
#inspectorBody { padding: 12px; }
.inspect-name { margin-bottom: 10px; }
.fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.field { display: grid; gap: 3px; min-width: 0; color: var(--muted); font-size: 12px; }
.field > :is(input, select, textarea) { font-size: 13px; color: var(--text); width: 100%; }
.field.wide { grid-column: 1/-1; }
.field textarea { min-height: 60px; resize: vertical; }
.volume-controls { display: grid; grid-template-columns: minmax(0,1fr) 62px; align-items: center; gap: 8px; }
.volume-controls input { width: 100%; min-width: 0; margin: 0; }
.rotate-hint { margin-top: 8px; }
.inspect-footer { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
.inspect-footer button { font-size: 12px; }
.timeline { margin: 0 18px; }
.timeline .sectionbar { flex-wrap: wrap; gap: 8px; }
.tools button, .tools select { min-height: 30px; padding: 3px 8px; font-size: 12px; }
.tools .divide { height: 20px; width: 1px; background: var(--line); margin: 0 3px; }
.timeline-grid { display: grid; grid-template-columns: 105px minmax(0, 1fr); background: #121419; }
.lane-labels { z-index: 2; border-right: 1px solid var(--line); background: var(--panel); }
.lane-labels div { height: 43px; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.lane-labels div:first-child { height: 28px; color: var(--muted); }
.lane-labels span { width: 7px; height: 7px; border-radius: 2px; background: var(--tone); }
.main-track { --tone: var(--main); --clip-bg: #273754; }
.overlay-track { --tone: var(--overlay); --clip-bg: #3b3056; }
.graphic-track { --tone: var(--graphic); --clip-bg: #493625; }
.audio-track { --tone: var(--audio); --clip-bg: #223d37; }
#timelineScroll { overflow: auto hidden; scrollbar-color: #4b505d #181b21; }
#timelineCanvas { position: relative; min-width: 100%; width: var(--timeline-width, 100%); }
#ruler { height: 28px; position: relative; color: var(--muted); cursor: crosshair; background: #1c1f25; }
.tick { position: absolute; bottom: 0; height: 8px; border-left: 1px solid #515665; }
.tick span { position: absolute; left: 4px; bottom: 8px; font: 10px ui-monospace, monospace; white-space: nowrap; }
.lane { height: 43px; border-bottom: 1px solid var(--line); position: relative; cursor: crosshair; background-image: repeating-linear-gradient(to right, #242831 0 1px, transparent 1px var(--tick-width, 80px)); }
.clip { touch-action: none; position: absolute; height: 34px; top: 4px; display: block; min-height: 0; overflow: hidden; color: var(--tone); background: var(--clip-bg); border: 1px solid color-mix(in srgb,var(--tone) 42%,#252a31); text-align: left; padding: 4px 9px; border-radius: 5px; line-height: 1.15; cursor: grab; }
.clip:hover:enabled { background: var(--clip-bg); border-color: var(--tone); }
.clip.selected { outline: 2px solid var(--tone); outline-offset: -2px; z-index: 1; }
.clip.missing { border-style: dashed; opacity: .65; }
.clip-content { display: block; pointer-events: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; font-weight: 720; }
.clip-length { display: block; pointer-events: none; font: 9px ui-monospace, monospace; margin-top: 2px; opacity: .8; }
.handle { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.handle:hover { background: color-mix(in srgb,var(--tone) 35%,transparent); }
.handle.start { left: 0; } .handle.end { right: 0; }
#playhead { position: absolute; inset: 0 auto 0 0; z-index: 3; width: 1px; background: var(--accent); pointer-events: none; }
#playhead::before { content: ""; position: absolute; top: 0; left: -4px; width: 9px; height: 9px; background: var(--accent); clip-path: polygon(0 0,100% 0,100% 50%,50% 100%,0 50%); }
.status { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 19px 13px; color: var(--muted); font-size: 12px; }
#status[data-error="true"] { color: #ffadad; }
dialog { width: min(440px, calc(100vw - 24px)); color: var(--text); padding: 19px; background: var(--panel); border: 1px solid #49505a; border-radius: 12px; }
dialog::backdrop { background: #06070bb8; }
dialog h2 { font-size: 17px; margin-bottom: 13px; }
dialog .actions { justify-content: flex-end; margin-top: 14px; }
dialog p { margin-top: 10px; }
progress { width: 100%; height: 12px; }
@media (max-width: 1060px) {
  .workspace { grid-template-columns: 176px minmax(0,1fr) 208px; }
}
@media (max-width: 750px) {
  header { padding: 10px 12px; }
  .workspace { grid-template-columns: minmax(0,1fr) minmax(0,1fr); padding: 10px; gap: 8px; }
  .viewer { grid-column: 1/-1; grid-row: 1; }
  .stage { height: auto; min-height: 0; }
  .surface { width: 100%; }
  .timeline { margin: 0 10px; } .timeline-grid { grid-template-columns: 86px minmax(0,1fr); }
  .status { padding-left: 10px; padding-right: 10px; }
  .brand { font-size: 17px; }
}
</style>
</head>
<body>
<!-- 維護約定：以 LLM 容易定位及修改為主。保持單檔交付，依責任分區。
     專案資料、播放狀態與 DOM 分開。預覽與匯出共用場景渲染及音訊混合。 -->
<header>
  <h1 class="brand"><span class="mark" aria-hidden="true"></span>HTMLmove</h1>
  <div class="actions">
    <button id="undo" class="subtle" title="復原 Ctrl+Z" aria-label="復原">↶</button>
    <button id="redo" class="subtle" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button>
    <button id="openProject">開啟專案</button>
    <button id="saveProject">儲存專案</button>
    <button id="showExport" class="primary">匯出影片</button>
  </div>
</header>
<main>
  <div class="workspace">
    <section class="panel materials" aria-label="素材庫">
      <div class="sectionbar"><h2>素材庫</h2><button id="importMedia">＋ 匯入</button></div>
      <div id="mediaList"></div>
    </section>
    <section class="panel viewer" aria-label="影片預覽">
      <div class="sectionbar">
        <h2>預覽</h2>
        <select id="resolution" aria-label="畫面解析度"><option value="720">720p · 16:9</option><option value="1080">1080p · 16:9</option></select>
      </div>
      <div class="stage" id="stage">
        <div class="surface" id="surface">
          <canvas id="canvas" width="1280" height="720" aria-label="影片合成畫面"></canvas>
          <div class="empty" id="emptyStage">
            <span class="empty-glyph" aria-hidden="true">＋</span>
            <strong>將影片或圖片拖曳到這裡</strong>
            <button id="emptyImport" class="primary">選擇本機檔案</button>
          </div>
        </div>
      </div>
      <div class="transport">
        <button id="firstFrame" title="回到起點" aria-label="回到起點">|◀</button>
        <button id="play" title="播放或暫停（空白鍵）" aria-label="播放">▶</button>
        <span id="timeReadout">00:00.00 / 00:00.00</span>
        <input type="range" id="scrub" min="0" max="0" step="0.01" value="0" aria-label="播放位置">
      </div>
    </section>
    <section class="panel inspector" aria-label="片段設定">
      <div class="sectionbar"><h2>片段設定</h2></div>
      <div id="inspectorBody"><p class="hint">選取時間軸上的片段，調整時間、音量或畫面。</p></div>
    </section>
  </div>
  <section class="panel timeline" aria-label="時間軸">
    <div class="sectionbar">
      <h2>時間軸</h2>
      <div class="tools">
        <button id="split" title="在播放頭分割片段（S）">✂ 分割</button>
        <button id="del" class="danger">刪除</button>
        <span class="divide" aria-hidden="true"></span>
        <button id="addText">T　上字</button>
        <select id="shape" aria-label="標記圖形">
          <option value="">＋ 圖形</option><option value="circle">○ 圓圈</option><option value="arrow">→ 箭頭</option>
          <option value="rect">□ 方框</option><option value="triangle">△ 三角形</option><option value="check">✓ 勾選</option>
          <option value="cross">× 叉號</option><option value="star">☆ 星形</option><option value="glyph">自訂符號</option>
        </select>
        <span class="divide" aria-hidden="true"></span>
        <select id="zoom" aria-label="時間軸縮放"><option value="fit">全片</option><option value="20">20 px／秒</option><option value="50">50 px／秒</option><option value="100">100 px／秒</option></select>
      </div>
    </div>
    <div class="timeline-grid">
      <div class="lane-labels">
        <div>時間</div>
        <div class="main-track"><span></span>主影片</div>
        <div class="overlay-track"><span></span>疊加影片</div>
        <div class="graphic-track" id="graphicLabel"><span></span>圖文與圖片</div>
        <div class="audio-track"><span></span>音樂</div>
      </div>
      <div id="timelineScroll">
        <div id="timelineCanvas">
          <div id="ruler"></div>
          <div class="lane main-track" id="mainLane"></div>
          <div class="lane overlay-track" id="overlayLane"></div>
          <div class="lane graphic-track" id="graphicLane"></div>
          <div class="lane audio-track" id="audioLane"></div>
          <div id="playhead"></div>
        </div>
      </div>
    </div>
  </section>
  <div class="status"><span id="status" role="status">可拖入影片、圖片或音樂開始剪輯</span><span><kbd>Space</kbd> 播放　<kbd>S</kbd> 分割　<kbd>Delete</kbd> 刪除</span></div>
</main>
<input id="files" type="file" accept="video/*,image/png,image/jpeg,image/webp,image/bmp,image/avif,audio/*,.mkv,.mov,.m4a,.mp4,.webm" multiple hidden>
<input id="projectFile" type="file" accept=".json,application/json" hidden>
<dialog id="exportDialog">
  <h2>匯出影片</h2>
  <div id="exportOptions">
    <div class="fields">
      <label class="field">解析度<select id="exportResolution"><option value="720">1280 × 720</option><option value="1080">1920 × 1080</option></select></label>
      <label class="field">格式<select id="exportFormat"></select></label>
    </div>
    <p id="exportEstimate" class="hint"></p>
  </div>
  <div id="exportProgress" hidden>
    <progress id="exportBar" max="1" value="0" aria-label="匯出進度"></progress>
    <p id="exportMessage" role="status" class="hint"></p>
  </div>
  <div class="actions"><button id="cancelExport">取消</button><button id="startExport" class="primary">開始匯出</button></div>
</dialog>
<script>
"use strict";

// 專案資料。主軌依陣列順序自動接片。其餘軌道以 start 儲存時間軸秒數。
// 影音片段用 from / to 表示來源秒數。圖文與圖片用 duration 表示停留秒數。
// 位置及大小以畫面比例表示，旋轉欄位 angle 以度數表示。
const $ = (id) => document.getElementById(id);
const canvas = $("canvas");
const layerNames = ["main", "overlay", "graphic", "audio"];
const shapeNames = { circle: "圓圈", arrow: "箭頭", rect: "方框", triangle: "三角形", check: "勾選", cross: "叉號", star: "星形", glyph: "自訂符號" };
const filters = {
  none: ["原色", "none"], gray: ["黑白", "grayscale(1)"], sepia: ["暖棕", "sepia(.65)"],
  vivid: ["鮮豔", "saturate(1.45) contrast(1.04)"], bright: ["提亮", "brightness(1.18)"]
};
const minClip = 0.05;
const maxVolume = 300;
const uid = () => crypto.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now().toString(36);
const numeric = (value, fallback) => Number.isFinite(value) ? value : fallback;
const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
const roundTime = (value) => Math.round(value * 1000) / 1000;
const isImageItem = (item) => Boolean(item.assetId) && Object.hasOwn(item, "duration");
const emptyProject = () => ({ version: 1, resolution: 720, assets: [], main: [], overlay: [], graphic: [], audio: [] });
const localMedia = new Map();
const undoStack = [];
const redoStack = [];
let project = emptyProject();
let selected = null;
let time = 0;
let schedule = {};
let finish = 0;
let pixelsPerSecond = 30;
let exporting = null;
let importBusy = false;
let playbackRequest = 0;
let playing = false;
let dragging = null;
let volumePreview = null;

function timecode(seconds, decimals = false) {
  const units = Math.floor(Math.max(0, seconds) * 100 + 0.00001);
  const minutes = Math.floor(units / 6000);
  const secs = Math.floor(units / 100) % 60;
  const fraction = decimals ? "." + String(units % 100).padStart(2, "0") : "";
  return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0") + fraction;
}
function status(message, error = false) {
  $("status").textContent = message;
  $("status").dataset.error = String(error);
}
function assetOf(item) {
  return project.assets.find((asset) => asset.id === item.assetId);
}
function itemDuration(item) {
  return item.duration ?? item.to - item.from;
}
function fitSlots(items, start, length, excluded) {
  let next = Math.max(0, start);
  for (const item of [...items].sort((a,b) => a.start - b.start)) {
    if (item.id === excluded || item.start + itemDuration(item) <= next + 0.000001) continue;
    if (next + length <= item.start + 0.000001) break;
    next = item.start + itemDuration(item);
  }
  return next;
}
function rebuildSchedule() {
  let head = 0;
  for (const layer of layerNames) {
    schedule[layer] = project[layer].map((item) => {
      const start = layer === "main" ? head : item.start;
      const end = start + itemDuration(item);
      if (layer === "main") head = end;
      return { item, start, end, layer };
    }).sort((a,b) => a.start - b.start);
  }
  finish = Math.max(0, ...layerNames.flatMap((layer) => schedule[layer].map((entry) => entry.end)));
  time = clamp(time, 0, finish);
}
function selectedEntry() {
  return selected && schedule[selected.layer]?.find((entry) => entry.item.id === selected.id);
}
function snapshot() {
  return JSON.stringify(project);
}
function commit(before, redraw = true) {
  if (snapshot() !== before) {
    undoStack.push(before);
    if (undoStack.length > 35) undoStack.shift();
    redoStack.length = 0;
    releaseUnusedMedia();
  }
  syncEditor(redraw);
}
function releaseUnusedMedia() {
  const retained = new Set(project.assets.map((asset) => asset.id));
  for (const previous of [...undoStack, ...redoStack]) {
    for (const asset of JSON.parse(previous).assets) retained.add(asset.id);
  }
  const unused = new Set();
  for (const [id, data] of localMedia) {
    if (retained.has(id)) continue;
    localMedia.delete(id);
    unused.add(data.url);
  }
  for (const data of localMedia.values()) unused.delete(data.url);
  for (const url of unused) URL.revokeObjectURL(url);
}
function syncEditor(redraw = true) {
  rebuildSchedule();
  if (!selectedEntry()) selected = null;
  if (redraw) {
    renderAssets();
    renderInspector();
  }
  setCanvasResolution(project.resolution);
  $("resolution").value = project.resolution;
  updateTimeline();
  refreshTransport();
  seekPreview();
}
function historyStep(source, dest) {
  if (!source.length || exporting || importBusy) return;
  pausePlayback();
  dest.push(snapshot());
  project = JSON.parse(source.pop());
  syncEditor();
}
function itemLabel(item) {
  if (item.assetId) return assetOf(item)?.name ?? "遺失素材";
  return item.shape ? (item.shape === "glyph" ? item.text : shapeNames[item.shape]) : item.text || "文字";
}
function selectItem(layer, id, render = true) {
  selected = { layer, id };
  if (render) renderInspector();
  for (const block of $("timelineCanvas").querySelectorAll(".clip")) {
    block.classList.toggle("selected", block.dataset.id === id);
  }
  refreshTransport();
}

// 素材匯入與專案檔。Object URL 保留原始檔參照，讀取影片不需先轉成 Base64。
function mediaKind(file) {
  if (/^image\/(png|jpeg|webp|bmp|avif|x-ms-bmp)$/i.test(file.type) || /\.(png|jpe?g|webp|bmp|avif)$/i.test(file.name)) return "image";
  if (file.type.startsWith("audio/") || /\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(file.name)) return "audio";
  return "video";
}
function waitMedia(element, event, ready, timeout = 8000) {
  if (ready()) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => done(new Error("讀取素材逾時")), timeout);
    const error = () => done(new Error("瀏覽器無法解碼此素材"));
    const loaded = () => { if (ready()) done(); };
    function done(problem) {
      clearTimeout(timer);
      element.removeEventListener(event, loaded);
      element.removeEventListener("error", error);
      if (problem) reject(problem);
      else resolve();

  drawScene(time);
  primeScene(time).then(() => {
    if (task === previewSeek && !playing && !exporting) drawScene(time);
  }).catch((error) => {
    if (task === previewSeek && !playing && !exporting) status(error.message, true);
  });
}
function seek(next) {
  pausePlayback();
  time = clamp(next,0,finish);
  updateTimeUI();
  seekPreview();
}
function stopClock() {
  cancelAnimationFrame(animationFrame);
  animationFrame = 0;
  for (const slot of mediaPool.values()) stopSlot(slot);
}
function pausePlayback() {
  if (exporting) return;
  playbackRequest++;
  buffering = false;
  playing = false;
  readyToPlay = false;
  stopClock();
  refreshTransport();
}
function startClock() {
  if (document.hidden && exporting) {
    stalledByTab = true;
    $("exportMessage").textContent = "已暫停，回到此分頁後繼續。";
    return;
  }
  // 啟動前先畫出已解碼的第一格，避免錄製時抓到黑畫面。
  drawScene(time);
  const recorder = exporting?.recorder;
  if (recorder?.state === "paused") recorder.resume();
  if (recorder?.state === "inactive") recorder.start(1000);
  timeOrigin = performance.now() - time * 1000;
  tickPlayback(performance.now());
}
function failPlayback(error) {
  if (exporting) stopExport(true, error.message);
  else {
    pausePlayback();
    status(error.message, true);
    seekPreview();
  }
}
async function resumeAfterBuffer(token) {
  try {
    await primeScene(time);
    if (token !== playbackRequest || !playing) return;
    readyToPlay = true;
    buffering = false;
    if (!stalledByTab) startClock();
  } catch (error) {
    if (token === playbackRequest) failPlayback(error);
  }
}
function tickPlayback(now) {
  if (!playing || buffering || stalledByTab) return;
  const position = clamp((now - timeOrigin) / 1000,0,finish);
  if (position >= finish) {
    time = finish;
    drawScene(time);
    if (exporting) stopExport(false);
    else {
      pausePlayback();
      seekPreview();
    }
    return;
  }
  const entries = activeMedia(position);
  warmMedia(position, entries);
  const slotEntries = entries.map((entry) => [entry, ensureSlot(entry)]).filter(([,slot]) => slot);
  const broken = slotEntries.find(([,slot]) => slot.element.error || slot.playError);
  if (broken) {
    failPlayback(new Error("無法播放 " + itemLabel(broken[0].item)));
    return;
  }
  const waiting = slotEntries.filter(([entry,slot]) => {
    const media = slot.element;
    return media.readyState < 2 || media.seeking ||
      Math.abs(media.currentTime - sourceAt(entry,position)) > (media.paused ? .12 : .28);
  });
  if (waiting.length) {
    const boundary = Math.min(position, ...waiting.map(([entry]) => entry.start > time ? entry.start : position));
    time = Math.max(time, boundary);
    buffering = true;
    readyToPlay = false;
    stopClock();
    if (exporting?.recorder.state === "recording") exporting.recorder.pause();
    resumeAfterBuffer(playbackRequest);
    return;
  }
  time = position;
  for (const [entry,slot] of slotEntries) {
    const volume = !exporting && volumePreview?.id === entry.item.id ? volumePreview.value : entry.item.volume;
    slot.gain.gain.value = volume/100;
    if (slot.element.paused) {
      const token = playbackRequest;
      slot.element.play().catch((error) => {
        if (error.name !== "AbortError" && token === playbackRequest) slot.playError = error;
      });
    }
  }
  drawScene(time);
  if (now - lastUIUpdate >= 44) {
    lastUIUpdate = now;
    updateTimeUI();
    if (exporting) updateExportUI();
    const scroll = $("timelineScroll");
    const x = time * pixelsPerSecond;
    if (!exporting && x > scroll.scrollLeft + scroll.clientWidth - 17) scroll.scrollLeft = Math.max(0, x - 22);
  }
  animationFrame = requestAnimationFrame(tickPlayback);
}
let lastUIUpdate = -Infinity;
async function togglePlayback() {
  if (!finish || exporting || importBusy) return;
  if (playing) {
    pausePlayback();
    seekPreview();
    return;
  }
  if (time >= finish - .001) time = 0;
  const token = ++playbackRequest;
  playing = true;
  refreshTransport();
  try {
    await prepareAudio();
    if (token !== playbackRequest) return;
    await resumeAfterBuffer(token);
  } catch (error) {
    if (token === playbackRequest) failPlayback(error);
  }
}

// 離線匯出。瀏覽器原生編碼器以 30 fps 錄製合成畫面，依支援情況提供 MP4 或 WebM。
const formats = [
  { name: "MP4", ext: "mp4", candidates: ["video/mp4;codecs=avc1.420028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4"] },
  { name: "WebM", ext: "webm", candidates: ["video/webm;codecs=vp8,opus", "video/webm;codecs=vp9,opus", "video/webm"] }
];
const audioRate = 128000;
const videoRate = (res) => Number(res) === 1080 ? 5000000 : 3000000;

function exportEstimate() {
  const size = (audioRate + videoRate($("exportResolution").value)) * finish / 8 / 1e6;
  $("exportEstimate").textContent = "時長 " + timecode(finish,true) + " · 30 fps · 約 " + Math.max(1,Math.round(size)) +
    " MB（依畫面而異）。匯出時間接近片長，請留在此分頁。";
}
function showExport() {
  if (exporting || importBusy || !finish) return;
  const needed = [...new Set(layerNames.flatMap((layer) =>
    project[layer].filter((item) => item.assetId && !localMedia.has(item.assetId)).map(itemLabel)))];
  if (needed.length) {
    status("匯出前請重新連結 " + needed.join("、"), true);
    return;
  }
  if (!window.MediaRecorder || !canvas.captureStream || !window.AudioContext) {
    status("此瀏覽器不支援影片匯出。請使用桌面版 Chrome 或 Edge。", true);
    return;
  }
  pausePlayback();
  seekPreview();
  const list = $("exportFormat");
  list.replaceChildren();
  for (const format of formats) {
    if (format.candidates.some((mime) => MediaRecorder.isTypeSupported(mime))) list.add(new Option(format.name,format.ext));
  }
  if (!list.options.length) {
    status("此瀏覽器沒有可用的影片編碼器。", true);
    return;
  }
  $("exportResolution").value = project.resolution;
  $("exportOptions").hidden = false;
  $("exportProgress").hidden = true;
  $("startExport").hidden = false;
  $("cancelExport").disabled = false;
  exportEstimate();
  $("exportDialog").showModal();
}
function updateExportUI() {
  if (!exporting?.recorder || stalledByTab) return;
  $("exportBar").value = time / finish;
  $("exportMessage").textContent = "正在匯出 " + timecode(time,true) + " / " + timecode(finish,true);
}
async function startExport() {
  if (exporting) return;
  const format = formats.find((entry) => entry.ext === $("exportFormat").value);
  const resolution = Number($("exportResolution").value);
  const task = { format, resolution, previousTime: time, chunks: [], cancelled: false, finishing: false };
  exporting = task;
  const token = ++playbackRequest;
  playing = true;
  stalledByTab = buffering = readyToPlay = false;
  $("exportOptions").hidden = true;
  $("exportProgress").hidden = false;
  $("startExport").hidden = true;
  $("exportBar").value = 0;
  $("exportMessage").textContent = "正在準備編碼器…";
  try {
    await prepareAudio();
    if (task !== exporting) return;
    speakers.gain.value = 0;
    task.destination = audioContext.createMediaStreamDestination();
    audioBus.connect(task.destination);
    setCanvasResolution(resolution);
    time = 0;
    await primeScene(0);
    if (task !== exporting) return;
    drawScene(0);
    task.canvasStream = canvas.captureStream(30);
    const stream = new MediaStream([...task.canvasStream.getVideoTracks(), ...task.destination.stream.getAudioTracks()]);
    for (const mimeType of format.candidates) {
      if (!MediaRecorder.isTypeSupported(mimeType)) continue;
      try {
        task.recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: videoRate(resolution), audioBitsPerSecond: audioRate });
        break;
      } catch {}
    }
    if (!task.recorder) throw new Error("無法啟動 " + format.name + " 編碼器，請試另一種匯出格式。");
    task.recorder.ondataavailable = ({data}) => {
      if (data.size && !task.cancelled) task.chunks.push(data);
    };
    task.recorder.onstop = () => completeExport(task);
    task.recorder.onerror = (event) => stopExport(true, event.error?.message || "影片編碼失敗。");
    readyToPlay = true;
    if (token === playbackRequest) startClock();
  } catch (error) {
    if (task === exporting) stopExport(true,error.message);
  }
}
function stopExport(cancelled, reason) {
  const task = exporting;
  if (!task || task.finishing) return;
  task.cancelled = cancelled;
  task.reason = reason;
  task.finishing = true;
  playbackRequest++;
  playing = readyToPlay = buffering = stalledByTab = false;
  stopClock();
  $("cancelExport").disabled = true;
  if (!cancelled) {
    $("exportBar").value = 1;
    $("exportMessage").textContent = "正在封裝影片…";
  }
  if (task.recorder && task.recorder.state !== "inactive") {
    task.recorder.stop();
  } else completeExport(task);
}
async function completeExport(task) {
  if (task !== exporting || task.completed) return;
  task.completed = true;
  playbackRequest++;
  playing = readyToPlay = buffering = stalledByTab = false;
  stopClock();
  let output;
  let reason = task.reason;
  try {
    if (!task.cancelled) {
      if (!task.chunks.length) throw new Error("瀏覽器未產生影片資料");
      const type = task.format.ext === "mp4" ? "video/mp4" : "video/webm";
      output = new Blob(task.chunks, { type });
      if (task.format.ext === "webm") output = await setWebmDuration(output, finish);
    }
  } catch (error) {
    reason = error.message;
  } finally {
    task.chunks.length = 0;
    for (const stream of [task.canvasStream,task.destination?.stream]) stream?.getTracks().forEach((track) => track.stop());
    if (task.destination) audioBus.disconnect(task.destination);
    if (speakers) speakers.gain.value = 1;
    exporting = null;
    $("exportDialog").close();
    setCanvasResolution(project.resolution);
    seek(task.previousTime);
  }
  if (output && !reason) {
    download(output,"HTMLmove-" + task.resolution + "p." + task.format.ext);
    status("已匯出 " + task.format.name + " · " + (output.size / 1e6).toFixed(1) + " MB");
  } else status(reason ? "匯出失敗 · " + reason : "已取消匯出", Boolean(reason));
}

// Chromium 的即時 WebM 可能省略 Duration。只讀容器開頭，不複製完整影片。
async function setWebmDuration(blob, seconds) {
  const bytes = new Uint8Array(await blob.slice(0,65536).arrayBuffer());
  function varint(at, id = false) {
    if (at >= bytes.length || !bytes[at]) return null;
    let width = 1;
    let mark = 128;
    while (!(bytes[at] & mark)) { width++; mark >>= 1; }
    if (at + width > bytes.length) return null;
    let value = id ? bytes[at] : bytes[at] & (mark - 1);
    let unknown = !id && value === mark-1;
    for (let i = 1; i < width; i++) {
      value = value * 256 + bytes[at+i];
      unknown = unknown && bytes[at+i] === 255;
    }
    return { width, value, unknown };
  }
  function element(at) {
    const id = varint(at,true);
    if (!id) return null;
    const lengthAt = at + id.width;
    const length = varint(lengthAt);
    if (!length) return null;
    const content = lengthAt + length.width;
    return { id: id.value, at, lengthAt, length, content, end: length.unknown ? Infinity : content+length.value };
  }
  function sizeBytes(value, min = 1) {
    let width = min;
    while (value >= 2 ** (7*width) - 1) width++;
    const out = new Uint8Array(width);
    for (let i = width-1; i >= 0; i--) {
      out[i] = value % 256;
      value = Math.floor(value/256);
    }
    out[0] |= 1 << (8-width);
    return out;
  }
  const header = element(0);
  const segment = header && element(header.end);
  if (segment?.id !== 0x18538067 || !segment.length.unknown) return blob;
  let info;
  let indexed = false;
  for (let ptr = segment.content; ptr < bytes.length;) {
    const item = element(ptr);
    if (!item || item.id === 0x1f43b675) break;
    if (item.id === 0x114d9b74 || item.id === 0x1c53bb6b) indexed = true;
    if (item.id === 0x1549a966) info = item;
    if (item.end <= ptr) break;
    ptr = item.end;
  }
  if (!info || info.end > bytes.length) return blob;
  let scale = 1000000;
  let duration;
  let padding;
  for (let ptr = info.content; ptr < info.end;) {
    const item = element(ptr);
    if (!item || item.end > info.end || item.end <= ptr) return blob;
    if (item.id === 0x2ad7b1) {
      scale = 0;
      for (let i = item.content; i < item.end; i++) scale = scale*256 + bytes[i];
    }
    if (item.id === 0x4489) duration = item;
    if (item.id === 0xec && (item.end-item.at === 11 || item.end-item.at >= 13)) padding = item;
    ptr = item.end;
  }
  if (!scale) return blob;
  const value = seconds * 1e9 / scale;
  if (duration) {
    const width = duration.length.value;
    if (width !== 4 && width !== 8) return blob;
    const out = new DataView(new ArrayBuffer(width));
    if (width === 4) out.setFloat32(0,value);
    else out.setFloat64(0,value);
    return new Blob([blob.slice(0,duration.content),out,blob.slice(duration.end)],{type:blob.type});
  }
  const addition = new Uint8Array(11);
  addition.set([0x44,0x89,0x88]);
  new DataView(addition.buffer).setFloat64(3,value);
  if (padding) {
    const remaining = padding.end - padding.at - addition.length;
    if (remaining === 0) return new Blob([blob.slice(0,padding.at),addition,blob.slice(padding.end)],{type:blob.type});
    const size = sizeBytes(remaining-2);
    if (size.length === 1) {
      const rest = new Uint8Array(remaining);
      rest[0] = 0xec;
      rest[1] = size[0];
      return new Blob([blob.slice(0,padding.at),addition,rest,blob.slice(padding.end)],{type:blob.type});
    }
  }
  if (indexed) return blob;
  return new Blob([blob.slice(0,info.lengthAt),sizeBytes(info.length.value+addition.length,info.length.width),
    blob.slice(info.content,info.end),addition,blob.slice(info.end)],{type:blob.type});
}

document.addEventListener("visibilitychange", () => {
  if (!playing) return;
  if (!exporting) {
    if (document.hidden) {
      pausePlayback();
      seekPreview();
    }
    return;
  }
  if (document.hidden) {
    stalledByTab = true;
    stopClock();
    if (exporting.recorder?.state === "recording") exporting.recorder.pause();
    $("exportMessage").textContent = "已暫停，回到此分頁後繼續。";
  } else if (stalledByTab) {
    stalledByTab = false;
    if (readyToPlay && !buffering) resumeAfterBuffer(playbackRequest);
  }
});

// 使用者操作入口。
$("files").addEventListener("change", (event) => {
  const files = [...event.target.files];
  event.target.value = "";
  importFiles(files);
});
$("projectFile").addEventListener("change", (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  openProject(file);
});
$("openProject").onclick = () => !importBusy && $("projectFile").click();
$("saveProject").onclick = () => { if (!importBusy) saveProject(); };
$("importMedia").onclick = $("emptyImport").onclick = () => !importBusy && $("files").click();
$("undo").onclick = () => historyStep(undoStack,redoStack);
$("redo").onclick = () => historyStep(redoStack,undoStack);
$("firstFrame").onclick = () => { $("timelineScroll").scrollLeft = 0; seek(0); };
$("play").onclick = togglePlayback;
$("scrub").oninput = (event) => seek(event.target.valueAsNumber);
$("zoom").onchange = () => {
  updateTimeline();
  const scroll = $("timelineScroll");
  if (time * pixelsPerSecond > scroll.scrollLeft + scroll.clientWidth) scroll.scrollLeft = time*pixelsPerSecond - 30;
};
$("resolution").onchange = (event) => {
  if (importBusy || exporting) { event.target.value = project.resolution; return; }
  pausePlayback();
  const before = snapshot();
  project.resolution = Number(event.target.value);
  commit(before);
};
$("split").onclick = splitClip;
$("del").onclick = deleteClip;
$("addText").onclick = () => addGraphic();
$("shape").onchange = (event) => {
  addGraphic(event.target.value);
  event.target.value = "";
};
$("timelineCanvas").addEventListener("pointerdown", (event) => {
  if (exporting || importBusy || event.button !== 0 || event.target.closest(".clip")) return;
  const rect = $("timelineCanvas").getBoundingClientRect();
  seek((event.clientX - rect.left) / pixelsPerSecond);
});
canvas.addEventListener("pointerdown",beginGraphicDrag);
canvas.addEventListener("pointermove",moveGraphic);
canvas.addEventListener("pointerup",endGraphicDrag);
canvas.addEventListener("pointercancel",endGraphicDrag);
const transferHasFiles = (event) => [...event.dataTransfer.types].includes("Files");
document.addEventListener("dragover",(event) => {
  if (transferHasFiles(event)) {
    event.preventDefault();
    event.dataTransfer.dropEffect = exporting ? "none" : "copy";
    $("emptyStage").classList.add("drop");
  }
});
document.addEventListener("dragleave",(event) => {
  if (!event.relatedTarget) $("emptyStage").classList.remove("drop");
});
document.addEventListener("drop",(event) => {
  if (!transferHasFiles(event)) return;
  event.preventDefault();
  $("emptyStage").classList.remove("drop");
  const files = [...event.dataTransfer.files];
  if (files.length === 1 && /\.json$/i.test(files[0].name)) openProject(files[0]);
  else importFiles(files);
});
document.addEventListener("keydown",(event) => {
  if ($("exportDialog").open || importBusy || event.target.closest("input, textarea, select, [contenteditable]")) return;
  const key = event.key.toLowerCase();
  if (key === "z" && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    if (event.shiftKey) historyStep(redoStack,undoStack);
    else historyStep(undoStack,redoStack);
  } else if (key === " " && !event.target.closest("button")) {
    event.preventDefault();
    togglePlayback();
  } else if (key === "s" && !(event.ctrlKey || event.metaKey)) splitClip();
  else if (key === "delete") deleteClip();
  else if (key === "arrowleft" || key === "arrowright") {
    event.preventDefault();
    seek(time + (key === "arrowleft" ? -1 : 1) * (event.shiftKey ? 1 : 1/30));
  }
});
$("showExport").onclick = showExport;
$("startExport").onclick = startExport;
$("exportResolution").onchange = exportEstimate;
$("cancelExport").onclick = () => exporting ? stopExport(true) : $("exportDialog").close();
$("exportDialog").addEventListener("cancel",(event) => {
  if (exporting) {
    event.preventDefault();
    stopExport(true);
  }
});
new ResizeObserver(() => updateTimeline()).observe($("timelineScroll"));
syncEditor();
</script>
</body>
</html>
